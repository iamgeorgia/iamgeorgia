# Runs on every pull request and every push to main. Cheapest checks first,
# both apps in parallel, and the server tests against a real PostGIS — the
# suite skips its database tests when Postgres is down, so a run without one
# would be a false green.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  client:
    name: Client — types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # `next typegen` first: PageProps, LayoutProps and next-env.d.ts are
      # generated files that are not committed, so a bare `tsc` on a fresh
      # checkout cannot find them.
      - run: npm run typecheck
      - run: npm run lint
      # The help registry against the page tree: a screen with no help
      # article fails here. Plain Node, no test runner to install.
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_TELEMETRY_DISABLED: "1"

  server:
    name: Server — schema, tests
    runs-on: ubuntu-latest
    # The whole job takes about two minutes. Without a limit a hung test
    # process holds the runner for GitHub's default of six hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # Same image as docker-compose.yml: the schema needs PostGIS.
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iamgeorgia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamgeorgia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iamgeorgia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      # `prisma migrate diff --exit-code` is deliberately not run here: the
      # GiST indexes on the `geo` columns live only in SQL migrations, because
      # Prisma cannot declare an index on an Unsupported type, so the schema
      # and the migrations never diff clean. `migrate deploy` above already
      # fails on a migration that does not apply.
      #
      # The suite reads the reference tables (house cancellation policies,
      # amenities, meal plans) rather than creating them, as a developer's
      # database always has them. Without this step a test dies half way
      # through a supertest request, the listening server it opened is never
      # closed, and the run sits there until the six-hour limit.
      - name: Seed reference data
        run: node --env-file=.env.test scripts/seed-reference.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:5000
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
